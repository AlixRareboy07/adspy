name: Scrape new domains

# Every ~10 minutes: look for domains you just added (never scraped yet).
# If there are none this finishes in a few seconds and does nothing else.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency: scrape          # same group as the main scraper so two scrapers never overlap

jobs:
  new-domains:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      AD_COUNTRY: ${{ vars.AD_COUNTRY || 'ALL' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Any new domains waiting?
        id: check
        working-directory: scraper
        run: |
          pip install -q requests
          python scrape.py --pending --count
      - name: Install browser
        if: steps.check.outputs.pending != '0'
        run: |
          pip install -q -r scraper/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Scrape new domains
        if: steps.check.outputs.pending != '0'
        working-directory: scraper
        run: python scrape.py --pending
      - name: Keep debug screenshots (only if something was blocked)
        if: always() && steps.check.outputs.pending != '0'
        uses: actions/upload-artifact@v4
        with:
          name: debug-new
          path: scraper/debug/
          if-no-files-found: ignore
          retention-days: 7
