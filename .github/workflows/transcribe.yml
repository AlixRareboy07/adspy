name: Transcribe ads

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency: transcribe

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Anything waiting?
        id: check
        working-directory: scraper
        run: |
          pip install -q requests
          python transcribe.py --count
      - name: Cache Whisper model
        if: steps.check.outputs.pending != '0'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1
      - name: Install Whisper
        if: steps.check.outputs.pending != '0'
        run: pip install -q -r scraper/requirements-transcribe.txt
      - name: Transcribe
        if: steps.check.outputs.pending != '0'
        working-directory: scraper
        run: python transcribe.py
