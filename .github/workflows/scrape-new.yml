name: Scrape new domains

# Every ~10 minutes: fills in store countries, then looks for new domains / deep-research
# requests. If nothing is waiting this finishes in seconds and does nothing else.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency: scrape          # same group as the main scraper so two scrapers never overlap

jobs:
  new-domains:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      AD_COUNTRY: ${{ vars.AD_COUNTRY || 'ALL' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Detect store countries + check what is waiting
        id: check
        working-directory: scraper
        run: |
          pip install -q requests
          python detect_countries.py || true
          python scrape.py --pending --count
          python research.py --count
      - name: Install browser
        if: steps.check.outputs.pending != '0' || steps.check.outputs.research != '0'
        run: |
          pip install -q -r scraper/requirements.txt
          # the apt mirror sometimes hangs: give each attempt 4 minutes, try up to 3 times
          for i in 1 2 3; do
            timeout 240 python -m playwright install --with-deps chromium && break
            echo "install attempt $i failed or timed out, retrying"; sleep 5
          done
          python -m playwright install chromium
      - name: Scrape new domains
        if: steps.check.outputs.pending != '0'
        working-directory: scraper
        run: python scrape.py --pending
      - name: Deep research requests
        if: steps.check.outputs.research != '0'
        working-directory: scraper
        run: python research.py
      - name: Keep debug screenshots (only if something was blocked)
        if: always() && (steps.check.outputs.pending != '0' || steps.check.outputs.research != '0')
        uses: actions/upload-artifact@v4
        with:
          name: debug-new
          path: scraper/debug/
          if-no-files-found: ignore
          retention-days: 7
